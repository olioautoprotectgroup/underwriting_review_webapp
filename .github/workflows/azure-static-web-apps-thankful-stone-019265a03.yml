name: Azure Static Web Apps CI/CD

# PR preview ("staging") environments are deliberately DISABLED: this
# workflow triggers on pushes to main only, so nothing ever creates one.
#
# Why: the Close Pull Request Job that tears a preview down fails with
# "No matching static site found" — an open upstream bug,
# Azure/static-web-apps#1638. It failed on every merge, so every PR leaked
# its environment. The Free plan allows only 3, and once full, EVERY preview
# deploy fails with "This Static Web App already has the maximum number of
# staging environments" (this blocked PRs #5 and #6 until they were cleared
# by hand). Passing the deployment token to that job was necessary but did
# not fix it.
#
# PR gating is unaffected — .github/workflows/ci.yml runs typecheck and the
# full test suite on pull_request. Only preview *sites* are gone.
#
# To re-enable once the upstream bug is fixed: restore the `pull_request`
# trigger (types: [opened, synchronize, reopened, closed]), restore the
# `if:` guard on build_and_deploy_job so it skips the closed action, and
# re-add a close_pull_request_job WITH
# azure_static_web_apps_api_token — Azure's generated template omits it.
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_STONE_019265A03 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

